name: Update Wallpapers

on:
  schedule:
    - cron: '0 0 * * *' # Runs at Midnight UTC
  workflow_dispatch:      # Manual run button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install Pillow

    - name: Generate Year Wallpaper
      run: python generate_year_wallpaper.py

    - name: Commit and Push
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "79442510+Ben0x0a-git@users.noreply.github.com"
        git add -A
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update wallpapers" && git push)
